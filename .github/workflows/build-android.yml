name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install
        working-directory: android-app
        run: npm install
      - name: Add Android project
        working-directory: android-app
        run: |
          npm run web
          npx cap add android
      - name: Icon and splash
        working-directory: android-app
        continue-on-error: true
        run: |
          mkdir -p assets
          cp ../ios-app/resources/AppIcon-1024.png assets/icon-only.png
          cp ../ios-app/resources/AppIcon-1024.png assets/icon-foreground.png
          cp ../ios-app/resources/splash-2732.png assets/splash.png
          npx capacitor-assets generate --android --iconBackgroundColor '#1e1e1e' --splashBackgroundColor '#1e1e1e'
      - name: Fix icon resources
        working-directory: android-app
        run: |
          RES=android/app/src/main/res
          if ! ls $RES/mipmap-*/ic_launcher_background.* >/dev/null 2>&1; then
            rm -rf $RES/mipmap-anydpi-v26
          fi
      - name: Sync and build debug APK
        working-directory: android-app
        run: |
          npx cap sync android
          cd android
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: lyric-player-android
          path: android-app/android/app/build/outputs/apk/debug/*.apk
